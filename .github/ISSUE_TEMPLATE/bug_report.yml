name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please do not paste database URLs, secrets or real customer data.
        Security problems: use a private security advisory instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How are you running ssERP?
      options: [Vercel + Neon, Local (npm run dev), Local (npm start), Docker, Other]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ssERP version / commit
  - type: input
    id: env
    attributes:
      label: Node.js version and database (Neon or plain Postgres, version)
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Redact anything sensitive.
