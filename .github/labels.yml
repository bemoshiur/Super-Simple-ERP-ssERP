# Issue and pull request labels. Apply with: scripts/sync-labels.sh (needs the GitHub CLI, `gh auth login`).
# Format: a flat list; every entry has name, color (6 hex digits, no #) and description (max 100 characters).

# ---- Type
- name: "bug"
  color: "d73a4a"
  description: "Something does not work as documented"
- name: "enhancement"
  color: "a2eeef"
  description: "New feature or improvement"
- name: "documentation"
  color: "0075ca"
  description: "README, docs/ or wiki changes"
- name: "question"
  color: "d876e3"
  description: "Further information is requested"
- name: "security"
  color: "b60205"
  description: "Security hardening or a fixed vulnerability (report new ones privately)"
- name: "dependencies"
  color: "0366d6"
  description: "Dependency updates (Dependabot and manual upgrades)"
- name: "ci"
  color: "6f42c1"
  description: "GitHub Actions workflows and repository automation"
- name: "performance"
  color: "fbca04"
  description: "Speed, query cost or bundle size"
- name: "refactor"
  color: "c5def5"
  description: "Code change that neither fixes a bug nor adds a feature"

# ---- Status
- name: "needs-triage"
  color: "ededed"
  description: "Not yet looked at by a maintainer"
- name: "needs-info"
  color: "fef2c0"
  description: "Waiting for more information from the reporter"
- name: "confirmed"
  color: "0e8a16"
  description: "Reproduced or accepted by a maintainer"
- name: "blocked"
  color: "b60205"
  description: "Cannot move until something else is resolved"
- name: "in-progress"
  color: "1d76db"
  description: "Someone is working on it"
- name: "wontfix"
  color: "ffffff"
  description: "Will not be worked on"
- name: "duplicate"
  color: "cfd3d7"
  description: "This issue or pull request already exists"
- name: "stale"
  color: "dddddd"
  description: "No activity for 60 days; closes after 14 more days without activity"

# ---- Priority
- name: "p0-critical"
  color: "b60205"
  description: "Data loss, money or serial integrity, security, or install broken for everyone"
- name: "p1-high"
  color: "d93f0b"
  description: "Important; next release"
- name: "p2-medium"
  color: "fbca04"
  description: "Normal priority"
- name: "p3-low"
  color: "c2e0c6"
  description: "Nice to have"

# ---- Area
- name: "area:inventory"
  color: "bfdadc"
  description: "Products, stock, serial units, adjustments, counts, transfers"
- name: "area:sales"
  color: "bfdadc"
  description: "POS, invoices, payments, returns, dues"
- name: "area:purchases"
  color: "bfdadc"
  description: "Purchases, vendor payments, purchase returns, CSV serial import"
- name: "area:accounting"
  color: "bfdadc"
  description: "Accounts, income and expense, transfers, voids"
- name: "area:reports"
  color: "bfdadc"
  description: "Reports, CSV exports, dashboard"
- name: "area:auth"
  color: "bfdadc"
  description: "Sign-in, sessions, users, roles and permissions"
- name: "area:installer"
  color: "bfdadc"
  description: "Web installer, npm run setup, install.sh"
- name: "area:ui"
  color: "bfdadc"
  description: "Layout, styling, accessibility, scanning UI, labels"
- name: "area:docs"
  color: "bfdadc"
  description: "Documentation and wiki"
- name: "area:db"
  color: "bfdadc"
  description: "Schema, migrations, drivers (Neon / pg)"
- name: "area:i18n"
  color: "bfdadc"
  description: "Bengali and other languages, number and date formats"
- name: "area:docker"
  color: "bfdadc"
  description: "Dockerfile and docker-compose"

# ---- Community
- name: "good first issue"
  color: "7057ff"
  description: "Small, well-described task for a first contribution"
- name: "help wanted"
  color: "008672"
  description: "Maintainers would welcome a pull request"
- name: "roadmap"
  color: "5319e7"
  description: "Tracked on docs/ROADMAP.md"
- name: "breaking-change"
  color: "e99695"
  description: "Changes behaviour, configuration or data in a way users must act on"
- name: "pinned"
  color: "000000"
  description: "Kept open on purpose; never marked stale"
