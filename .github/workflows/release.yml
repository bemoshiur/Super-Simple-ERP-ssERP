# Release: push a tag `vX.Y.Z` (or `vX.Y.Z-rc.N`) that matches package.json. The workflow re-runs the fast checks,
# builds once, and creates a GitHub Release with notes generated from merged pull requests (categories in
# .github/release.yml). Versions below 1.0.0 or with a pre-release suffix are marked as pre-releases. No build
# artefacts are attached: ssERP is deployed from source (Vercel, npm, Docker). See docs/RELEASING.md.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify tag, lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Tag must equal "v" + package.json version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match package.json version $version (expected v$version)."
            exit 1
          fi
          major="${version%%.*}"
          if [ "$major" = "0" ] || [[ "$version" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Releasing $TAG (prerelease: $(tail -1 "$GITHUB_OUTPUT"))"
      - run: npm ci
      - run: npm run check:theme -- --identifiers
      - run: npm run check:docs
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - name: Build (dummy environment, no database needed)
        run: npm run build
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/sserp
          AUTH_SECRET: ci-build-secret-ci-build-secret-0123456789
          NEXT_TELEMETRY_DISABLED: '1'

  release:
    name: Create GitHub Release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the release
    steps:
      - name: Create the release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          flags=(--verify-tag --generate-notes --title "ssERP $TAG")
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving it unchanged."
          else
            gh release create "$TAG" "${flags[@]}"
          fi
